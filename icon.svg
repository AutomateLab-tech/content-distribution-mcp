<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#4F46E5"/>
  <!-- Central node -->
  <circle cx="50" cy="50" r="10" fill="#fff"/>
  <!-- Satellite nodes -->
  <circle cx="20" cy="25" r="7" fill="#fff" opacity="0.85"/>
  <circle cx="80" cy="25" r="7" fill="#fff" opacity="0.85"/>
  <circle cx="15" cy="65" r="7" fill="#fff" opacity="0.85"/>
  <circle cx="85" cy="65" r="7" fill="#fff" opacity="0.85"/>
  <circle cx="50" cy="88" r="7" fill="#fff" opacity="0.85"/>
  <!-- Spokes -->
  <line x1="50" y1="50" x2="20" y2="25" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="80" y2="25" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="15" y2="65" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="85" y2="65" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="50" y2="88" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
</svg>
