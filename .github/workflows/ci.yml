name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: MCP introspection smoke test
        run: |
          output=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 10 node dist/index.js 2>/dev/null)
          version=$(node -p "require('./package.json').version")
          echo "$output" | grep -q '"result"'
          echo "$output" | grep -q "\"version\":\"$version\""
          echo "introspection OK"
